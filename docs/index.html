<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLB Probable Starters</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #3b82f6;
      --green: #22c55e;
      --yellow: #eab308;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      padding: 2rem 1rem 4rem;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header { margin-bottom: 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header .meta { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; }

    .section-title {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* ── Available cards ── */
    .available-section { margin-bottom: 2.5rem; }

    .available-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 0.5rem;
    }

    .available-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .available-card:hover { border-color: var(--accent); }

    .available-card .flag { font-size: 1.1rem; margin-right: 0.35rem; }
    .available-card .name { font-weight: 500; }
    .available-card .matchup { font-size: 0.76rem; color: var(--muted); margin-top: 0.1rem; }

    .pct-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pct-low  { background: #14532d33; color: #4ade80; }
    .pct-mid  { background: #71401233; color: var(--yellow); }
    .pct-high { background: #1e3a5f33; color: #60a5fa; }

    /* ── Games list ── */
    .games-section { }

    .game-row {
      border-bottom: 1px solid var(--border);
    }
    .game-row:first-child { border-top: 1px solid var(--border); }

    .game-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 0;
    }

    .team-block .team-name { font-size: 0.76rem; color: var(--muted); }
    .team-block .pitcher-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.1rem;
    }
    .team-block.home .pitcher-row { flex-direction: row-reverse; }
    .team-block.home { text-align: right; }
    .team-block.home .team-name { text-align: right; }

    .pitcher-name { font-weight: 500; cursor: pointer; }
    .pitcher-name:hover { color: var(--accent); }
    .pitcher-name.tbd { color: var(--muted); font-style: italic; font-weight: 400; cursor: default; }
    .pitcher-flag { font-size: 1rem; }

    .ownership-pct { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
    .ownership-pct.available { color: var(--green); }

    .vs-col { text-align: center; color: var(--muted); font-size: 0.75rem; }
    .vs-col .time { display: block; margin-top: 0.2rem; font-size: 0.7rem; }

    /* ── Expandable recent starts ── */
    .starts-panel {
      display: none;
      background: var(--surface2);
      border-top: 1px solid var(--border);
      padding: 0.85rem 1rem;
    }
    .starts-panel.open { display: block; }

    .starts-panel h4 {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .starts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .starts-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 0.2rem 0.5rem 0.35rem 0;
      border-bottom: 1px solid var(--border);
    }
    .starts-table td {
      padding: 0.3rem 0.5rem 0.3rem 0;
      border-bottom: 1px solid #1e2130;
    }
    .starts-table tr:last-child td { border-bottom: none; }
    .starts-table .result-W { color: var(--green); font-weight: 600; }
    .starts-table .result-L { color: #f87171; font-weight: 600; }
    .starts-table .result-ND { color: var(--muted); }

    .no-starts { color: var(--muted); font-size: 0.82rem; font-style: italic; }

    footer { margin-top: 3rem; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="date-label">MLB Probable Starters</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="available-section">
    <div class="section-title">Likely Available in 12-Team League</div>
    <div class="available-grid" id="available-grid"></div>
  </div>

  <div class="games-section">
    <div class="section-title">All Matchups — click a pitcher for recent starts</div>
    <div id="games-list"></div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
  function pctClass(pct) {
    if (pct < 20) return 'pct-low';
    if (pct < 45) return 'pct-mid';
    return 'pct-high';
  }

  function utcToLocal(utcStr) {
    if (!utcStr) return '';
    return new Date(utcStr).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  }

  function startsTable(pitcher) {
    if (!pitcher || !pitcher.recent_starts || pitcher.recent_starts.length === 0) {
      return '<p class="no-starts">No recent start data available.</p>';
    }
    const rows = pitcher.recent_starts.map(s => `
      <tr>
        <td>${s.date}</td>
        <td>${s.matchup}</td>
        <td>${s.ip}</td>
        <td>${s.h}</td>
        <td>${s.er}</td>
        <td>${s.bb}</td>
        <td>${s.k}</td>
        <td class="result-${s.result}">${s.result}</td>
      </tr>
    `).join('');
    return `
      <table class="starts-table">
        <thead><tr>
          <th>Date</th><th>Opp</th><th>IP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function togglePanel(panelId) {
    const el = document.getElementById(panelId);
    if (el) el.classList.toggle('open');
  }

  function pitcherBlock(pitcher, side) {
    if (!pitcher) {
      return `<div class="team-block ${side}">
        <div class="team-name"></div>
        <div class="pitcher-row"><span class="pitcher-name tbd">TBD</span></div>
      </div>`;
    }
    const panelId = `panel-${pitcher.id}`;
    const pctAvail = pitcher.ownership !== null && pitcher.ownership < 65;
    const pctLabel = pitcher.ownership !== null
      ? `${pitcher.ownership}% owned`
      : '';
    return `
      <div class="team-block ${side}">
        <div class="pitcher-row">
          ${pitcher.flag ? `<span class="pitcher-flag">${pitcher.flag}</span>` : ''}
          <span class="pitcher-name" onclick="togglePanel('${panelId}')">${pitcher.name}</span>
        </div>
        ${pctLabel ? `<div class="ownership-pct ${pctAvail ? 'available' : ''}">${pctLabel}</div>` : ''}
      </div>
    `;
  }

  async function load() {
    let data;
    try {
      const resp = await fetch('data.json?cb=' + Date.now());
      data = await resp.json();
    } catch (e) {
      document.getElementById('date-label').textContent = 'Failed to load data.json';
      return;
    }

    document.title = `MLB Starters — ${data.date_label}`;
    document.getElementById('date-label').textContent = `MLB Probable Starters — ${data.date_label}`;
    document.getElementById('meta').textContent =
      `Available threshold: <${data.availability_threshold}% owned on ESPN · ${data.generated_at.replace('T', ' ').replace('Z', ' UTC')}`;

    // Available grid
    const grid = document.getElementById('available-grid');
    if (!data.available || data.available.length === 0) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">None found below threshold.</p>';
    } else {
      grid.innerHTML = data.available.map(p => `
        <div class="available-card" onclick="togglePanel('panel-${p.id || p.name}')">
          <div>
            <div class="name">
              ${p.flag ? `<span class="flag">${p.flag}</span>` : ''}${p.name}
            </div>
            <div class="matchup">${p.matchup}</div>
          </div>
          <span class="pct-badge ${pctClass(p.pct_owned)}">${p.pct_owned}%</span>
        </div>
      `).join('');
    }

    // Games list
    const list = document.getElementById('games-list');
    list.innerHTML = data.games.map(g => {
      const ap = g.away_pitcher;
      const hp = g.home_pitcher;
      const apPanel = ap ? `panel-${ap.id}` : null;
      const hpPanel = hp ? `panel-${hp.id}` : null;

      // Build combined starts panel (one panel per game row, split by pitcher)
      const panelContent = [
        ap ? `<div><h4>${ap.flag ? ap.flag + ' ' : ''}${ap.name} — Last ${ap.recent_starts.length} Starts</h4>${startsTable(ap)}</div>` : '',
        hp ? `<div style="margin-top:${ap ? '1.25rem' : '0'}"><h4>${hp.flag ? hp.flag + ' ' : ''}${hp.name} — Last ${hp.recent_starts.length} Starts</h4>${startsTable(hp)}</div>` : '',
      ].filter(Boolean).join('');

      const panelId = `panel-game-${g.away_team.replace(/\s/g,'')}`;

      return `
        <div class="game-row">
          <div class="game-header">
            <div class="team-block away">
              <div class="team-name">${g.away_team}</div>
              <div class="pitcher-row">
                ${ap ? `<span class="pitcher-flag">${ap.flag || ''}</span>` : ''}
                <span class="pitcher-name ${ap ? '' : 'tbd'}" ${ap ? `onclick="togglePanel('${panelId}')"` : ''}>${ap ? ap.name : 'TBD'}</span>
              </div>
              ${ap && ap.ownership !== null ? `<div class="ownership-pct ${ap.ownership < 65 ? 'available' : ''}">${ap.ownership}% owned</div>` : ''}
            </div>

            <div class="vs-col">
              @
              <span class="time">${utcToLocal(g.game_time_utc)}</span>
            </div>

            <div class="team-block home">
              <div class="team-name">${g.home_team}</div>
              <div class="pitcher-row">
                <span class="pitcher-name ${hp ? '' : 'tbd'}" ${hp ? `onclick="togglePanel('${panelId}')"` : ''}>${hp ? hp.name : 'TBD'}</span>
                ${hp ? `<span class="pitcher-flag">${hp.flag || ''}</span>` : ''}
              </div>
              ${hp && hp.ownership !== null ? `<div class="ownership-pct ${hp.ownership < 65 ? 'available' : ''}">${hp.ownership}% owned</div>` : ''}
            </div>
          </div>

          ${panelContent ? `<div class="starts-panel" id="${panelId}">${panelContent}</div>` : ''}
        </div>
      `;
    }).join('');

    document.getElementById('footer').textContent =
      `Data: MLB Stats API + ESPN Fantasy · ${data.generated_at.replace('T', ' ').replace('Z', ' UTC')}`;
  }

  load();
</script>
</body>
</html>
